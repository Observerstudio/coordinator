<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Observer · Engineering Workflow</title>
<style>
  html,body{margin:0;background:#070a0e;min-height:100%}
  body{display:flex;justify-content:center;padding:40px 20px;
    font-family:'Hanken Grotesk',system-ui,sans-serif;color:#e9eef6}
  .wrap{width:100%;max-width:960px}
</style>
</head>
<body>
<div class="wrap">
<div id="bp">
  <header class="bp-h">
    <div class="kick">OBSERVER · ENGINEERING WORKFLOW</div>
    <h1>From idea to shipped</h1>
    <p class="lede">People own the <em class="eh">judgment</em>. Machines own the <em class="ea">build</em>. Pick a station.</p>
    <div class="filters" role="group" aria-label="Filter by owner">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="human" aria-pressed="false"><i class="sw h"></i>Human</button>
      <button data-f="ai" aria-pressed="false"><i class="sw a"></i>AI &amp; CI</button>
      <button data-f="both" aria-pressed="false"><i class="sw b"></i>Both</button>
    </div>
  </header>

  <div class="bp-body">
    <ol class="line" id="line"></ol>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>

  <footer class="legend">
    <span><i class="sw h"></i>Human-in-the-loop · plan, decide, review</span>
    <span><i class="sw a"></i>Away-from-keyboard · agents &amp; CI</span>
    <span><i class="sw b"></i>Shared · dev or agent / human-approved</span>
  </footer>
</div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;700&family=Hanken+Grotesk:wght@400;500;600&display=swap');
#bp{
  --ink:#0b0e13;--ink2:#11151d;--surf:rgba(255,255,255,.025);--surf2:rgba(255,255,255,.05);
  --tx:#e9eef6;--tx2:#9aa6b6;--tx3:#646f7e;--bd:rgba(255,255,255,.09);
  --h:#f6a93b;--a:#34e3c4;--blend:linear-gradient(120deg,#f6a93b,#34e3c4);
  --disp:'Syne',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--body:'Hanken Grotesk',system-ui,sans-serif;
  font-family:var(--body);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:30px 30px 22px;
  background-image:
    radial-gradient(1100px 500px at 12% -10%,rgba(246,169,59,.10),transparent 60%),
    radial-gradient(1000px 520px at 100% 0%,rgba(52,227,196,.10),transparent 55%),
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(var(--ink),var(--ink));
  background-size:auto,auto,26px 26px,26px 26px,auto;
}
#bp .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#bp .kick{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--tx3);margin-bottom:12px}
#bp h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:.98;margin:0 0 10px;
  letter-spacing:-.02em;background:var(--blend);-webkit-background-clip:text;background-clip:text;color:transparent}
#bp .lede{font-size:15px;color:var(--tx2);margin:0 0 22px;max-width:46ch}
#bp .lede .eh{font-style:normal;color:var(--h);font-weight:600}
#bp .lede .ea{font-style:normal;color:var(--a);font-weight:600}
#bp .filters{display:flex;gap:8px;flex-wrap:wrap}
#bp .filters button{font:inherit;font-size:12.5px;cursor:pointer;color:var(--tx2);background:var(--surf);
  border:1px solid var(--bd);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:7px;transition:.18s}
#bp .filters button:hover{color:var(--tx);border-color:var(--tx3)}
#bp .filters button[aria-pressed="true"]{color:var(--ink);background:var(--tx);border-color:var(--tx);font-weight:600}
#bp .filters button[aria-pressed="true"] .sw{outline:2px solid var(--ink)}
#bp .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
#bp .sw.h{background:var(--h)}#bp .sw.a{background:var(--a)}#bp .sw.b{background:var(--blend)}

#bp .bp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:26px;margin-top:26px}
@media(max-width:680px){#bp .bp-body{grid-template-columns:1fr}}

#bp .line{list-style:none;margin:0;padding:0;position:relative}
#bp .line::before{content:"";position:absolute;left:19px;top:18px;bottom:18px;width:2px;
  background:linear-gradient(var(--h),var(--a));opacity:.45;border-radius:2px}
#bp .st{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
  font:inherit;color:var(--tx);background:transparent;border:0;padding:13px 12px;border-radius:12px;
  transition:.18s;opacity:0;transform:translateX(-8px);animation:in .5s forwards}
#bp .line li+li{margin-top:4px}
@keyframes in{to{opacity:1;transform:none}}
#bp .st:hover{background:var(--surf)}
#bp .st.dim{opacity:.26 !important;filter:saturate(.5)}
#bp .st .node{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);position:relative;z-index:1;
  box-shadow:0 0 0 4px var(--ink)}
#bp .st.human .node{background:var(--h)}#bp .st.ai .node{background:var(--a)}#bp .st.both .node{background:var(--blend)}
#bp .st .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
#bp .st .nm{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
#bp .st .ln{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
#bp .st.sel{background:var(--surf2)}
#bp .st.sel .node{box-shadow:0 0 0 4px var(--ink),0 0 0 6px currentColor;animation:pulse 2s infinite}
#bp .st.sel.human{color:var(--h)}#bp .st.sel.ai{color:var(--a)}#bp .st.sel.both{color:var(--a)}
#bp .st.sel .nm{color:var(--tx)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--ink),0 0 0 6px currentColor}50%{box-shadow:0 0 0 4px var(--ink),0 0 0 9px transparent}}

#bp .panel{position:sticky;top:14px;align-self:start;border:1px solid var(--bd);border-radius:16px;
  background:linear-gradient(180deg,var(--surf2),var(--surf));padding:24px 24px 22px;min-height:300px;overflow:hidden}
#bp .panel .watermark{position:absolute;right:-6px;top:-26px;font-family:var(--disp);font-weight:800;
  font-size:150px;line-height:1;color:var(--tx);opacity:.045;pointer-events:none}
#bp .panel .ptag{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);padding:4px 10px;border-radius:999px;display:inline-block}
#bp .panel .pnum{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:.2em;margin-left:10px}
#bp .panel h3{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-.015em;margin:14px 0 6px;line-height:1.04}
#bp .panel .pdesc{font-size:14px;color:var(--tx2);margin:0 0 18px;line-height:1.5}
#bp .panel dl{display:grid;grid-template-columns:118px 1fr;gap:12px 16px;margin:0;font-size:13.5px}
#bp .panel dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding-top:2px}
#bp .panel dd{margin:0;color:var(--tx);line-height:1.45}
#bp .panel a{color:var(--a);text-decoration:none;border-bottom:1px solid rgba(52,227,196,.4)}
#bp .panel a:hover{border-color:var(--a)}
#bp .panel .swap{animation:sw .35s ease}
@keyframes sw{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#bp .legend{margin-top:22px;padding-top:16px;border-top:1px solid var(--bd);display:flex;gap:22px;flex-wrap:wrap;
  font-size:12px;color:var(--tx2)}
#bp .legend span{display:flex;align-items:center;gap:8px}
</style>

<script>
(function(){
  var R="https://github.com/Observerstudio/selal-v2/";
  var S=[
    {t:"Report & root-cause",lane:"human",owner:"Engineering lead",desc:"A problem comes in; we find the real cause from real data before anyone writes code.",out:"A confirmed root cause, evidence-backed",gate:"Evidence over guesses — read-only investigation",ex:'A warehouse showed an impossible negative stock count — we traced it to the true cause from the real movement history, not guesswork.'},
    {t:"Plan it (PRD)",lane:"human",owner:"Engineering lead",desc:"The fix is written up as a short product requirements doc: problem, solution, scope.",out:"A PRD with problem, solution & user stories",gate:"Scoped and agreed before building",ex:'The “make inventory numbers trustworthy” work was written up as a short <a href="'+R+'issues/164" target="_blank" rel="noopener">product requirements doc</a> before any code.'},
    {t:"Slice into issues",lane:"human",owner:"Engineering lead",desc:"The plan is split into small, independent tasks — each tagged for a human or an agent.",out:"Independent tasks, each with acceptance criteria",gate:"Thin vertical slices, clear done-criteria",ex:'That doc became <a href="'+R+'issues/165" target="_blank" rel="noopener">six small tasks</a> — e.g. “capture server errors”, “reconcile stock counts”, “guard warehouse transfers”.'},
    {t:"Route the work",lane:"human",owner:"Engineering lead",desc:"Each task is assigned: routine work to an AI agent, judgment work to a person.",out:"Assignments — agent-ready vs human-only",gate:"Sensitive / judgment work stays with people",ex:'The routine fixes went to an AI agent; the calls that change how staff work or the system’s design were kept for people.'},
    {t:"Implement",lane:"both",owner:"A developer or an AI agent",desc:"The code is written on its own branch, following the plan exactly — by a person or an agent.",out:"Code on a branch that follows the plan",gate:"Stay strictly inside the task’s scope",ex:'An AI agent built the error-monitoring fix; developers build the other tasks the same way.'},
    {t:"Open PR, linked to task",lane:"ai",owner:"Agent / developer",desc:"A pull request is opened that references the task, so the trail is automatic.",out:'A pull request that auto-links and closes its task',gate:"Small, reviewable change",ex:'The agent opened a <a href="'+R+'pull/175" target="_blank" rel="noopener">pull request</a> linked to its task, so the task closed automatically on merge.'},
    {t:"Automated checks (CI)",lane:"ai",owner:"CI / CD pipeline",desc:"Every change is gated by machines: type-check, tests, build, and a live preview.",out:"Type-check, tests, build, preview deployment",gate:"All checks green — required to merge",ex:'The error-monitoring change had to pass type-checks, tests and a build before any person reviewed it.'},
    {t:"Review",lane:"human",owner:"Engineering lead",desc:"A person checks scope, correctness, and verifies the change actually works.",out:"Approve, or request changes",gate:"Scope · correctness · manual verification",ex:'A person reviewed the change and confirmed the error-monitoring actually worked on a live preview before approving.'},
    {t:"Merge & verify",lane:"both",owner:"Human decides · system executes",desc:"With green checks and human approval, the change merges itself and the task closes.",out:"Merged to main; task closes; verified live",gate:"Green CI + explicit human approval",ex:'On approval the change <a href="'+R+'pull/175" target="_blank" rel="noopener">merged automatically</a>, the task closed, and the fix was confirmed working in live monitoring.'}
  ];
  var L={human:{l:"Human",c:"#f6a93b"},ai:{l:"AI & CI",c:"#34e3c4"},both:{l:"Human + AI",c:"#9fc8a0"}};
  function tagStyle(lane){return lane==="both"?"background:linear-gradient(120deg,#f6a93b,#34e3c4)":"background:"+L[lane].c;}
  var line=document.getElementById("line"),panel=document.getElementById("panel"),sel=0,filter="all";

  function matches(lane){return filter==="all"||filter===lane;}
  function build(){
    line.innerHTML="";
    S.forEach(function(s,i){
      var li=document.createElement("li");
      var b=document.createElement("button");
      b.className="st "+s.lane+(i===sel?" sel":"")+(matches(s.lane)?"":" dim");
      b.style.animationDelay=(i*55)+"ms";
      b.innerHTML='<span class="node">'+(i+1)+'</span><span class="meta"><span class="nm">'+s.t+'</span><span class="ln">'+L[s.lane].l+'</span></span>';
      b.onclick=function(){sel=i;build();paint(true);};
      li.appendChild(b);line.appendChild(li);
    });
  }
  function paint(anim){
    var s=S[sel];
    panel.className="panel";
    panel.innerHTML='<span class="watermark">'+(sel+1)+'</span>'+
      '<div class="'+(anim?"swap":"")+'">'+
      '<span class="ptag" style="'+tagStyle(s.lane)+'">'+L[s.lane].l+'</span><span class="pnum">STEP '+(sel+1)+' / 9</span>'+
      '<h3>'+s.t+'</h3><p class="pdesc">'+s.desc+'</p>'+
      '<dl><dt>Owner</dt><dd>'+s.owner+'</dd>'+
      '<dt>Produces</dt><dd>'+s.out+'</dd>'+
      '<dt>Quality gate</dt><dd>'+s.gate+'</dd>'+
      '<dt>In practice</dt><dd>'+s.ex+'</dd></dl></div>';
  }
  document.querySelectorAll("#bp .filters button").forEach(function(btn){
    btn.onclick=function(){
      filter=btn.getAttribute("data-f");
      document.querySelectorAll("#bp .filters button").forEach(function(b){b.setAttribute("aria-pressed",b===btn?"true":"false");});
      build();
    };
  });
  build();paint(false);
})();
</script>
</body>
</html>
