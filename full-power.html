<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full power</title>
<meta name="description" content="A mock replay of one day of coordinated agent work, staged inside a faithful recreation of the terminal window it really happens in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --ground:#1a1c22; --pane:#22252d; --ink:#d4d7de; --dim:#7c8290; --border:#3a3f4b;
  --accent:#e39a4a; --green:#5ec07a;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.45;overflow:hidden}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit;padding:0}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}

.win{display:grid;grid-template-rows:30px 30px 22px 1fr;height:100dvh}

/* title bar */
.titlebar{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--border);color:var(--dim);font-size:12px}
.dots{display:flex;gap:6px}
.dots span{width:11px;height:11px;border-radius:50%;display:inline-block}
.dots span:nth-child(1){background:#ff5f57}.dots span:nth-child(2){background:#febc2e}.dots span:nth-child(3){background:#28c840}
.titlebar .wname{margin-left:2px}
.titlebar .ctrls{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim)}
.titlebar .ctrls button{color:var(--dim)}
.titlebar .ctrls button:hover{color:var(--ink)}
.titlebar input[type=range]{width:90px;height:2px;accent-color:var(--accent)}
.titlebar .station{min-width:70px;text-align:right}
.titlebar .follow{border:1px solid var(--border);border-radius:3px;padding:1px 6px}
.titlebar .follow[data-on="true"]{color:var(--accent);border-color:var(--accent)}

/* tab bar */
.tabbar{display:flex;align-items:stretch;border-bottom:1px solid var(--border)}
.tabbtn{position:relative;padding:0 16px;border-right:1px solid var(--border);color:var(--dim);border-top:2px solid transparent}
.tabbtn[data-active="true"]{color:var(--ink);border-top-color:var(--accent);background:var(--pane)}
.tabbtn .dot{position:absolute;top:6px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.tabbtn .dot[hidden]{display:none}
.tabplus{padding:0 14px;color:var(--dim)}

/* station strip */
.stations{display:flex;gap:18px;align-items:center;padding:0 14px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--border)}
.stations b{color:var(--dim);font-weight:500}
.stations .st[data-now="true"]{color:var(--accent)}

/* body */
.body{display:grid;grid-template-columns:230px 1fr;overflow:hidden}
.sidebar{border-right:1px solid var(--border);padding:14px 12px;overflow:auto;color:var(--dim);font-size:12.5px}
.sidebar h4{margin:0 0 6px;font-weight:500;color:var(--dim);font-size:11.5px;letter-spacing:.03em}
.space{padding:5px 6px;border-radius:3px;display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.space .top{display:flex;gap:6px;align-items:center}
.space .sub{padding-left:14px;color:var(--dim)}
.space.active{background:#2a2e38;color:var(--ink)}
.dotchar{color:var(--dim)}
.dotchar.on{color:var(--accent)}
.space.active .dotchar{color:var(--accent)}
.agents{margin-top:18px}
.agent{padding:4px 6px;border-radius:3px;cursor:pointer}
.agent:hover{background:#242830}
.agent .top{display:flex;gap:6px;align-items:center}
.agent .sub{padding-left:14px;font-size:11.5px}

.main{overflow:hidden;padding:12px;display:flex;flex-direction:column;min-height:0}
.tabpage[hidden]{display:none}
.tabpage{height:100%;display:flex;flex-direction:column;min-height:0}
.onecol{flex:1;min-height:0}
.twocol{flex:1;display:grid;grid-template-columns:1fr 1.5fr;gap:12px;min-height:0}
.leftstack{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}

/* pane */
.pane{position:relative;border:1px solid var(--border);background:var(--pane);display:flex;flex-direction:column;min-height:0;padding-top:14px}
.pane .ptitle{position:absolute;top:-1px;left:12px;transform:translateY(-50%);background:var(--pane);padding:0 6px;color:var(--dim);font-size:11.5px}
.pbody{flex:1;overflow-y:auto;padding:6px 12px}
.ln{white-space:pre-wrap;word-break:break-word;padding:2px 0}
.ln.prompt{color:var(--ink);font-weight:700}
.ln.bullet{color:var(--ink)}
.ln.blocked{color:var(--accent)}
.ln.dim{color:var(--dim)}
.ln.sub{color:var(--dim);padding-left:14px}

.composer{border-top:1px solid var(--border);padding:6px 12px 8px}
.composer .prompt{color:var(--ink);font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cursor{display:inline-block;width:7px;color:var(--ink);animation:blink 1s step-end infinite}
.cursor.hide{visibility:hidden}
@keyframes blink{50%{opacity:0}}
.pillopt{border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:1px 8px;margin-right:8px}
.statusline{margin-top:6px;color:var(--dim);font-size:11.5px}
.statusline .row{display:flex;gap:8px;flex-wrap:wrap}
.bar{letter-spacing:-1px}
.bar.ctx{color:#c9d16a}
.bar.usage{color:#d18ad1}
.bar.weekly{color:#7aa7d1}
.statusline .green{color:var(--green)}
.statusline .foot{display:flex;justify-content:space-between;margin-top:2px}

@media (max-width:900px){
  .body{grid-template-columns:0 1fr}
  .sidebar{display:none}
  .twocol{grid-template-columns:1fr}
  .leftstack{grid-template-rows:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <span class="dots"><span></span><span></span><span></span></span>
    <span class="wname">MacBook-Pro: OCH</span>
    <div class="ctrls">
      <button class="follow" id="followBtn" data-on="true">follow</button>
      <button id="stepBack" aria-label="Step back">&lsaquo;</button>
      <button id="playPause" aria-label="Play or pause">&#9655; play</button>
      <button id="stepFwd" aria-label="Step forward">&rsaquo;</button>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Scrub">
      <span class="station" id="stationLabel">1 &middot; Need</span>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>
  <div class="stations" id="stations"></div>

  <div class="body">
    <div class="sidebar">
      <h4>spaces</h4>
      <div class="space"><div class="top"><span class="dotchar">&#9675;</span> selal-v2</div><div class="sub">feat/1507-guarantor-b&hellip;</div></div>
      <div class="space active"><div class="top"><span class="dotchar on">&#9679;</span> OCH</div><div class="sub">main</div></div>
      <div class="agents">
        <h4>agents &middot; grouped</h4>
        <div id="agentList"></div>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var STATION_NAMES = ["Need","Decide","Brief","Build","Collide","Gate","Ship","Note"];
var TRACKS = [
  {key:"pdf", name:"Invoice PDF", branch:"feat/invoice-pdf"},
  {key:"tax", name:"Tax rounding", branch:"feat/tax-rounding"},
  {key:"csv", name:"CSV export", branch:"feat/csv-export"}
];
var AGENTS = [{key:"master", name:"Master", model:"Opus 5"}].concat(
  TRACKS.map(function(t){ return {key:t.key, name:t.name, model:"Sonnet 5"}; })
);

/* ---------- transcript deltas: line objects appended per station, per pane ---------- */
function L(type, text){ return {type:type, text:text}; }
function bulletsFor(track, sha, score, note){
  var lines = [L("bullet","Cold review at "+sha+": "+score+"/10"+(note?(" — "+note):""))];
  return lines;
}

var MASTER = [
  [], /* station 0: nothing in body yet, composer holds the typed line */
  [ L("prompt","Ship the invoicing fixes this week."),
    L("bullet","Reading PRD §52 and the last handoff…"),
    L("dim","Ran 2 shell commands"),
    L("bullet","Three tracks: Invoice PDF, Tax rounding, CSV export. Opening tabs.") ],
  [], [],
  [ L("prompt","[from Tax rounding] rounding mode reserved for Ahmed: half-up or banker's?") ],
  [], [],
  [ L("bullet","Three PRs merged. One decision recorded. Nothing blocked.") ]
];

var COORD = {
  pdf: [ [], [ L("prompt","/ponytail full — you coordinate track: Invoice PDF. Read the handoff…") ],
    [ L("bullet","Brief written: scope invoice/pdf, pattern index.html, test pin selftest.") ],
    [], [],
    bulletsFor("pdf","a1b2c3d",10),
    [ L("bullet","Taking the integration slot"), L("dim","SLOT-RELEASED"), L("bullet","Squash-merged #41") ],
    [ L("bullet","Wrote docs/notes/2026-09-07-invoice-pdf.md") ] ],
  tax: [ [], [ L("prompt","/ponytail full — you coordinate track: Tax rounding. Read the handoff…") ],
    [ L("bullet","Brief written: scope tax/rounding, reserved decision: rounding mode.") ],
    [ L("blocked","[from LANE-A] LANE-BLOCKED — rounding mode: half-up or banker's? Coordinator must pick."), L("dim","Escalated to Master.") ],
    [],
    bulletsFor("tax","d4e5f6a",10),
    [ L("bullet","Taking the integration slot"), L("dim","SLOT-RELEASED"), L("bullet","Squash-merged #42") ],
    [ L("bullet","Wrote docs/notes/2026-09-07-tax-rounding.md") ] ],
  csv: [ [], [ L("prompt","/ponytail full — you coordinate track: CSV export. Read the handoff…") ],
    [ L("bullet","Brief written: scope csv/export, pattern money/format.ts.") ],
    [],
    [ L("bullet","money/format.ts is claimed by Invoice PDF. Messaging their coordinator."), L("prompt","[from Invoice PDF] merged. Go ahead and rebase."), L("bullet","Rebased on main. Suite green.") ],
    bulletsFor("csv","9f8e7d6",9,"item 6: mutation did not bite").concat([ L("prompt","rework: add mutation test for money.Round"), L("bullet","LANE-DONE — feat/csv-export a1b2c3d rework 1"), L("bullet","Cold review again: 10/10") ]),
    [ L("bullet","Taking the integration slot"), L("dim","SLOT-RELEASED"), L("bullet","Squash-merged #43") ],
    [ L("bullet","Wrote docs/notes/2026-09-07-csv-export.md") ] ]
};

var LANE = {
  "pdf-a": [ [], [], [ L("prompt","/ponytail full — you are LANE-A. Read docs/lanes/LANE-BRIEF-invoice-pdf.md…") ],
    [ L("bullet","Reading 3 files"), L("dim","Ran 1 shell command"), L("bullet","Added renderer for line items") ],
    [], [ L("dim","gate passed, 10/10") ], [], [] ],
  "pdf-b": [ [], [], [ L("prompt","/ponytail full — you are LANE-B. Read docs/lanes/LANE-BRIEF-invoice-pdf.md…") ],
    [ L("bullet","Added golden-file test for layout") ],
    [], [], [], [] ],
  "tax-a": [ [], [], [ L("prompt","/ponytail full — you are LANE-A. Read docs/lanes/LANE-BRIEF-tax-rounding.md…") ],
    [ L("blocked","LANE-BLOCKED — rounding mode: half-up or banker's? Coordinator must pick.") ],
    [], [ L("dim","gate passed, 10/10") ], [], [] ],
  "tax-b": [ [], [], [ L("prompt","/ponytail full — you are LANE-B. Read docs/lanes/LANE-BRIEF-tax-rounding.md…") ],
    [ L("bullet","Added rounding edge-case tests, waiting on mode") ],
    [], [], [], [] ],
  "csv-a": [ [], [], [ L("prompt","/ponytail full — you are LANE-A. Read docs/lanes/LANE-BRIEF-csv-export.md…") ],
    [ L("bullet","Reading 3 files"), L("dim","Ran 1 shell command"), L("bullet","Writing exporter for line items") ],
    [ L("dim","✳ waiting"), L("bullet","Rebased onto main after PDF merge") ],
    [ L("prompt","rework: add mutation test for money.Round"), L("bullet","LANE-DONE — feat/csv-export a1b2c3d rework 1") ],
    [], [] ],
  "csv-b": [ [], [], [ L("prompt","/ponytail full — you are LANE-B. Read docs/lanes/LANE-BRIEF-csv-export.md…") ],
    [ L("bullet","Added quoting and delimiter tests") ],
    [], [], [], [] ]
};

var FOCUS_TAB = [0, 0, 1, 0, 1, 3, 0, 0]; /* which tab the follow toggle jumps to, per station */
var AGENT_ACTIVE = { master:[0,1,7], pdf:[2,3,4,5,6], tax:[2,3,4,5,6], csv:[2,3,4,5,6] };

/* ---------- state ---------- */
var decisionChoice = null;
var idx = 0;
var playing = false;
var activeTab = 0;
var follow = true;
var seenTab = [0]; /* tabs the viewer has already looked at this station */

var tabbarEl = document.getElementById("tabbar");
var stationsEl = document.getElementById("stations");
var mainEl = document.getElementById("main");
var agentListEl = document.getElementById("agentList");
var stationLabelEl = document.getElementById("stationLabel");
var scrubEl = document.getElementById("scrub");
var playBtn = document.getElementById("playPause");
var followBtn = document.getElementById("followBtn");

/* ---------- build static DOM ---------- */
STATION_NAMES.forEach(function(name, i){
  var s = document.createElement("span");
  s.className = "st"; s.dataset.i = i;
  s.innerHTML = "<b>"+(i+1)+" "+name+"</b>";
  stationsEl.appendChild(s);
});

function tabCount(){ return idx >= 1 ? 4 : 1; }
function rebuildTabbar(){
  tabbarEl.innerHTML = "";
  var n = tabCount();
  for (var i=0;i<n;i++){
    (function(i){
      var b = document.createElement("button");
      b.className = "tabbtn"; b.dataset.i = i;
      b.dataset.active = (i===activeTab) ? "true":"false";
      b.innerHTML = (i+1)+" <span class=\"dot\" "+(seenTab.indexOf(i)>=0||i===activeTab?"hidden":"")+"></span>";
      b.addEventListener("click", function(){ follow=false; followBtn.dataset.on="false"; setActiveTab(i); });
      tabbarEl.appendChild(b);
    })(i);
  }
  var plus = document.createElement("span");
  plus.className = "tabplus"; plus.textContent = "+";
  tabbarEl.appendChild(plus);
}

function paneHTML(id, title){
  return '<div class="pane" data-pane="'+id+'"><div class="ptitle">─ '+title+' ─</div>' +
    '<div class="pbody" data-role="body"></div>' +
    '<div class="composer" data-role="composer"><div class="prompt"><span>❯</span><span data-role="ctext"></span><span class="cursor" data-role="cursor">▍</span></div>' +
    '<div class="statusline" data-role="status"></div></div></div>';
}

function buildMain(){
  mainEl.innerHTML = "";
  var page0 = document.createElement("div");
  page0.className = "tabpage"; page0.dataset.tab = "0"; page0.hidden = activeTab !== 0;
  page0.innerHTML = '<div class="onecol">'+paneHTML("master","master")+'</div>';
  mainEl.appendChild(page0);

  TRACKS.forEach(function(t, ti){
    var tabI = ti+1;
    var page = document.createElement("div");
    page.className = "tabpage"; page.dataset.tab = String(tabI); page.hidden = activeTab !== tabI;
    page.innerHTML = '<div class="twocol">' +
      '<div class="leftstack">' + paneHTML(t.key+"-a","LANE-A "+t.key) + paneHTML(t.key+"-b","LANE-B "+t.key) + '</div>' +
      paneHTML(t.key+"-coord","coordinator") +
      '</div>';
    mainEl.appendChild(page);
  });
}

function buildAgents(){
  agentListEl.innerHTML = "";
  AGENTS.forEach(function(a){
    var row = document.createElement("div");
    row.className = "agent"; row.dataset.key = a.key;
    row.innerHTML = '<div class="top"><span class="dotchar" data-role="adot">○</span> OCH &middot; '+a.name+'</div><div class="sub">claude</div>';
    row.addEventListener("click", function(){
      follow = false; followBtn.dataset.on = "false";
      setActiveTab(a.key === "master" ? 0 : TRACKS.map(function(t){return t.key;}).indexOf(a.key)+1);
    });
    agentListEl.appendChild(row);
  });
}
buildAgents();

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function lineHTML(l){
  var prefix = l.type==="prompt" ? "❯ " : (l.type==="bullet"||l.type==="blocked") ? "⏺ " : (l.type==="sub") ? "└ " : "";
  return '<div class="ln '+l.type+'">'+prefix+esc(l.text)+'</div>';
}
function cumulative(table, key, upTo){
  var out = [];
  for (var s=0; s<=upTo; s++){ out = out.concat(table[key][s] || []); }
  return out;
}
function statusHTML(model, branch, claims){
  return '<div class="row">['+model+'] &nbsp;OCH git:('+branch+'*)</div>' +
    '<div class="row"><span class="bar ctx">Context ██░░░░</span> 13% &nbsp;|&nbsp; <span class="bar usage">Usage ███░░░</span> 75% (resets in 1h 29m) &nbsp;|&nbsp; <span class="bar weekly">Weekly ██░░░░</span> 38%</div>' +
    '<div class="row">OCH &nbsp;0 unread &middot; '+claims+' claims &middot; session-full-power</div>' +
    '<div class="foot"><span class="green">⯵⯵ auto mode on</span> (shift+tab to cycle) &middot; ← for agents</div>';
}

function setActiveTab(i){
  activeTab = i;
  if (seenTab.indexOf(i) < 0) seenTab.push(i);
  document.querySelectorAll(".tabpage").forEach(function(p){ p.hidden = (+p.dataset.tab !== i); });
  document.querySelectorAll(".tabbtn").forEach(function(b){
    var bi = +b.dataset.i;
    b.dataset.active = (bi===i) ? "true":"false";
    var dot = b.querySelector(".dot");
    if (dot) dot.hidden = (bi===i) || seenTab.indexOf(bi)>=0;
  });
}

/* ---------- render ---------- */
function fillPane(id, lines, composerLines, model, branch, claims, cursorOn){
  var pane = mainEl.querySelector('.pane[data-pane="'+id+'"]');
  if (!pane) return;
  var body = pane.querySelector('[data-role="body"]');
  body.innerHTML = lines.map(lineHTML).join("");
  body.scrollTop = body.scrollHeight;
  var ctext = pane.querySelector('[data-role="ctext"]');
  var cursor = pane.querySelector('[data-role="cursor"]');
  var comp = pane.querySelector('[data-role="composer"] .prompt');
  if (composerLines){
    comp.innerHTML = composerLines;
  } else {
    comp.innerHTML = '<span>❯</span><span data-role="ctext"></span><span class="cursor" data-role="cursor">▍</span>';
    pane.querySelector('[data-role="ctext"]').textContent = "";
  }
  var cur = pane.querySelector('[data-role="cursor"]');
  if (cur) cur.classList.toggle("hide", cursorOn===false);
  pane.querySelector('[data-role="status"]').innerHTML = statusHTML(model, branch, claims);
}

function render(opts){
  opts = opts || {};
  rebuildTabbar();
  buildMain();

  stationsEl.querySelectorAll(".st").forEach(function(el){ el.dataset.now = (+el.dataset.i === idx) ? "true":"false"; });
  stationLabelEl.textContent = (idx+1)+" · "+STATION_NAMES[idx];
  scrubEl.value = idx/7;
  playBtn.innerHTML = playing ? "&#10074;&#10074; pause" : "&#9655; play";

  var claims = idx >= 6 ? 0 : 1;

  if (follow){
    var target = FOCUS_TAB[idx];
    if (target !== activeTab) setActiveTab(target);
  }

  /* master pane */
  var masterLines = cumulative({m:MASTER}, "m", idx);
  var masterComposer = null;
  if (idx === 0){
    masterComposer = '<span>❯</span><span data-role="ctext"></span><span class="cursor" data-role="cursor">▍</span>';
  } else if (idx === 3 && decisionChoice === null){
    masterComposer = '<span>❯</span><button class="pillopt" data-choice="up">half-up</button><button class="pillopt" data-choice="bankers">banker\'s</button>';
  }
  fillPane("master", masterLines, masterComposer, "Opus 5", "main", claims, idx!==0);
  if (idx === 0 && !reduced) typeInto(mainEl.querySelector('.pane[data-pane="master"] [data-role="ctext"]'), "Ship the invoicing fixes this week.");
  else if (idx === 0) mainEl.querySelector('.pane[data-pane="master"] [data-role="ctext"]').textContent = "Ship the invoicing fixes this week.";

  if (idx === 3 && decisionChoice === null){
    mainEl.querySelectorAll('.pillopt').forEach(function(b){
      b.addEventListener("click", function(){
        decisionChoice = b.dataset.choice;
        var label = decisionChoice === "up" ? "half-up" : "banker's";
        MASTER[3] = MASTER[3].concat([L("prompt", label)]);
        COORD.tax[3] = COORD.tax[3].concat([L("prompt","[from Master] use "+label+" rounding.")]);
        LANE["tax-a"][3] = LANE["tax-a"][3].concat([L("bullet","Resumed: "+label+" rounding.")]);
        render({forward:true});
      });
    });
  }

  /* coordinator + lane panes */
  TRACKS.forEach(function(t){
    var coordLines = cumulative(COORD, t.key, idx);
    fillPane(t.key+"-coord", coordLines, null, "Sonnet 5", t.branch, claims, true);
    ["a","b"].forEach(function(ab){
      var laneLines = cumulative(LANE, t.key+"-"+ab, idx);
      fillPane(t.key+"-"+ab, laneLines, null, "Sonnet 5", t.branch, claims, true);
    });
  });

  /* sidebar agent dots */
  AGENTS.forEach(function(a){
    var row = agentListEl.querySelector('.agent[data-key="'+a.key+'"]');
    var on = AGENT_ACTIVE[a.key].indexOf(idx) >= 0;
    row.querySelector('[data-role="adot"]').classList.toggle("on", on);
    row.querySelector('[data-role="adot"]').textContent = on ? "●" : "○";
  });

  maybePause();
}

function typeInto(el, text){
  if (!el) return;
  if (typeof gsap === "undefined"){ el.textContent = text; return; }
  var obj = {n:0};
  gsap.to(obj, {n:text.length, duration:Math.max(text.length/40,.05), ease:"none", onUpdate:function(){
    el.textContent = text.slice(0, Math.round(obj.n));
  }});
}

function maybePause(){
  if (idx === 3 && decisionChoice === null){
    playing = false; playBtn.innerHTML = "&#9655; play";
  }
}

/* ---------- transport ---------- */
function step(dir){
  var next = idx + dir;
  if (next < 0 || next > 7) return;
  if (dir > 0 && idx === 3 && decisionChoice === null) return;
  idx = next;
  seenTab = follow ? [FOCUS_TAB[idx]] : seenTab;
  render({forward: dir>0});
}
function togglePlay(){
  playing = !playing;
  playBtn.innerHTML = playing ? "&#10074;&#10074; pause" : "&#9655; play";
  if (playing) tick();
}
function tick(){
  if (!playing) return;
  if (idx === 3 && decisionChoice === null){ playing = false; playBtn.innerHTML = "&#9655; play"; return; }
  if (idx >= 7){ playing = false; playBtn.innerHTML = "&#9655; play"; return; }
  setTimeout(function(){
    if (!playing) return;
    step(1);
    tick();
  }, reduced ? 10 : 1700);
}

playBtn.addEventListener("click", togglePlay);
document.getElementById("stepFwd").addEventListener("click", function(){ step(1); });
document.getElementById("stepBack").addEventListener("click", function(){ step(-1); });
scrubEl.addEventListener("input", function(){
  var target = Math.round(+scrubEl.value * 7);
  if (target > 3 && idx <= 3 && decisionChoice === null) target = 3;
  idx = target;
  render({forward:false});
});
followBtn.addEventListener("click", function(){
  follow = !follow;
  followBtn.dataset.on = follow ? "true":"false";
  if (follow) render({forward:false});
});
document.addEventListener("keydown", function(e){
  if (e.key === " "){ e.preventDefault(); togglePlay(); }
  if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
});

render({forward:false});

/* ---------- self-test ---------- */
if (location.hash === "#selftest"){
  var fails = [];
  function assert(cond, msg){ if (!cond) fails.push(msg); }
  decisionChoice = "up";
  idx = 7; render({forward:false});
  assert(stationsEl.querySelectorAll('[data-now="true"]').length === 1, "exactly one lit-now station");
  assert(+stationsEl.querySelector('[data-now="true"]').dataset.i === 7, "station strip lit index at end");
  TRACKS.forEach(function(t){
    var lines = cumulative(COORD, t.key, 7).map(function(l){return l.text;}).join(" ");
    assert(lines.indexOf("Squash-merged") >= 0, "coordinator "+t.key+" reports a squash-merge by Note");
  });
  assert(mainEl.querySelector('.pane[data-pane="master"] [data-role="status"]').textContent.indexOf("0 claims") >= 0, "claims drop to 0 by Ship/Note");
  idx = 5; render({forward:false});
  assert(mainEl.querySelector('.pane[data-pane="master"] [data-role="status"]').textContent.indexOf("1 claims") >= 0, "claims still 1 before Ship");
  console.assert(fails.length === 0, "full-power selftest failures:", fails);
  if (fails.length === 0) console.log("full-power selftest: OK"); else console.log(fails);
  idx = 0; decisionChoice = null; render({forward:false});
}
})();
</script>
</body>
</html>
