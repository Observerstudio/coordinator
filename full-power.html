<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full power</title>
<meta name="description" content="A mock replay of one day of coordinated agent work: a master, three coordinators, six lanes, one shared decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --bg:#f6f5f1; --ink:#1d2230; --muted:#6a7080; --line:#d9d8d2; --line-strong:#b9b8b0;
  --accent:#2d4fb5; --term-bg:#1d2230; --term-ink:#e6eaf0; --term-muted:#8b93a8;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
button{font:inherit;cursor:pointer;background:none;border:0;color:var(--ink);padding:4px 6px}
button:disabled{opacity:.35;cursor:default}
code{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:60px 44px 1fr;height:100dvh;overflow:hidden}
@media (max-width:820px){.app{height:auto;overflow:visible}}

/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line)}
.hdr .ctrls{display:flex;align-items:center;gap:10px;margin-left:auto;color:var(--muted);font-size:13px}
.hdr input[type=range]{width:min(220px,30vw);accent-color:var(--accent);height:2px}
.hdr .stationlbl{font-family:var(--mono);min-width:110px;text-align:right}

/* stations */
.steps{display:grid;grid-template-columns:repeat(8,1fr);padding:0 18px;align-items:end;height:44px;border-bottom:1px solid var(--line)}
.step{font-size:11.5px;color:var(--muted);padding-bottom:8px;border-bottom:2px solid transparent;margin-bottom:-1px}
.step b{font-weight:700}
.step[data-lit="past"]{color:var(--ink)}
.step[data-lit="now"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:820px){.steps{grid-template-columns:repeat(4,1fr);height:auto;padding:8px}}

/* stage + rail */
.stagewrap{display:grid;grid-template-columns:1fr 300px;overflow:hidden}
@media (max-width:980px){.stagewrap{grid-template-columns:1fr;overflow:visible}}
.stage{position:relative;padding:14px 18px;overflow:auto;transition:opacity .3s}
.stage.dim{opacity:.5}
.rail{border-left:1px solid var(--line);padding:14px;overflow:auto}
.rail h2{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 10px}
.rail .hint{color:var(--muted);font-size:13px}
.msg{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:8px;font-size:12.5px;background:#fff}
.msg .from{font-weight:700;font-size:11px;color:var(--accent);display:block;margin-bottom:2px}

/* you bar */
.youbar{font-family:var(--mono);font-size:14px;padding:6px 0}
.youbar b{color:var(--accent)}
.youbar .decision{margin-top:8px;font-family:var(--sans)}
.pillbtn{display:inline-block;margin-right:8px;margin-top:4px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px}

/* dark terminal cards */
.term{background:var(--term-bg);color:var(--term-ink);border-radius:8px;padding:9px 12px;margin-top:10px}
.term .hd{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.term .hd .name{font-weight:700}
.term .badge{font-size:10px;border:1px solid #3a4258;border-radius:999px;padding:2px 7px;color:var(--term-muted)}
.term .hd .state{margin-left:auto;color:var(--term-muted);font-size:11.5px}
.term pre{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--term-muted);white-space:pre-wrap;line-height:1.55;min-height:2.3em;cursor:pointer}
.term pre .cur{color:var(--term-ink)}
.term.typing pre .cur::after{content:"\2588";margin-left:1px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* tracks */
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
@media (max-width:980px){.tracks{grid-template-columns:1fr}}
.track h3{font-size:12.5px;color:var(--muted);font-weight:700;margin:0}
.lanewrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lanewrap .term{margin-top:8px}
.prrow{margin-top:10px;display:flex;align-items:center;gap:8px;position:relative;min-height:24px}
.prchip{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid var(--line-strong);color:var(--muted)}
.prchip[data-state="score"]{color:var(--accent);border-color:var(--accent)}
.prchip[data-state="merged"]{color:#1c7a3d;border-color:#1c7a3d}

/* slot badge + message pills */
.slotbadge{position:absolute;top:0;left:0;width:22px;height:22px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  transform:translate(-9999px,-9999px);pointer-events:none;z-index:5}
.pill{position:absolute;background:var(--accent);color:#fff;font-size:10.5px;border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none;z-index:6;transform:translate(-50%,-50%)}

/* side panel */
.panel{position:fixed;inset:0;background:rgba(29,34,48,.35);display:flex;justify-content:flex-end;z-index:20}
.panel[hidden]{display:none}
.panel .box{width:min(420px,92vw);background:#fff;height:100%;padding:20px;overflow:auto;border-left:1px solid var(--line-strong)}
.panel pre{white-space:pre-wrap;font-family:var(--mono);font-size:13px;margin-top:10px}
.panel button{border:1px solid var(--line-strong);border-radius:6px;padding:6px 10px}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <h1>Full power</h1>
    <div class="ctrls">
      <button id="stepBack" aria-label="Step back">&larr;</button>
      <button id="playPause" aria-label="Play or pause">Play</button>
      <button id="stepFwd" aria-label="Step forward">&rarr;</button>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Scrub">
      <span class="stationlbl" id="stationLabel">1 &middot; Need</span>
    </div>
  </header>

  <div class="steps" id="steps"></div>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="youbar" id="youbar"><b>You</b> &rsaquo; &ldquo;Ship the invoicing fixes this week.&rdquo;</div>

      <div class="term" id="masterNode" data-node="master">
        <div class="hd"><span class="name">Master</span><span class="badge">Opus</span><span class="state" data-role="state">waiting</span></div>
        <pre data-role="log"></pre>
      </div>

      <div class="tracks" id="tracks"></div>
    </div>
    <div class="rail" id="rail">
      <h2>Messages</h2>
      <div class="hint" id="railHint">Nothing yet. Play to begin.</div>
    </div>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <div class="box">
    <button id="panelClose">Close (Esc)</button>
    <h2 id="panelTitle" style="margin-top:12px"></h2>
    <pre id="panelBody"></pre>
  </div>
</div>

<script>
(function(){
"use strict";
var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var STATION_NAMES = ["Need","Decide","Brief","Build","Collide","Gate","Ship","Note"];
var TRACKS = [
  {key:"pdf", name:"Invoice PDF", lanes:["lane-pdf-1","lane-pdf-2"]},
  {key:"tax", name:"Tax rounding", lanes:["lane-tax-1","lane-tax-2"]},
  {key:"csv", name:"CSV export", lanes:["lane-csv-1","lane-csv-2"]}
];

var LANE_LINES = {
  pdf: [[], [], ["lane-pdf-1: claim c_a1 scope invoice/pdf"], ["lane-pdf-1: writing render.go", "lane-pdf-2: writing pdf_test.go"], ["lane-pdf-1: touching money/format.ts, merging first"], ["lane-pdf-1: gate 10/10, squash-merge"], [], ["lane-pdf-1: released claim"]],
  tax: [[], [], ["lane-tax-1: claim c_a2 scope tax/rounding"], ["lane-tax-1: hit reserved decision, paused"], ["lane-tax-1: resumed with your call"], ["lane-tax-1: gate 10/10, squash-merge"], [], ["lane-tax-1: released claim"]],
  csv: [[], [], ["lane-csv-1: claim c_a3 scope csv/export"], ["lane-csv-1: writing exporter.go", "lane-csv-2: writing exporter_test.go"], ["lane-csv-1: waiting on money/format.ts", "lane-csv-1: rebased onto main"], ["lane-csv-1: gate 9/10, item 6 reworked", "lane-csv-1: gate 10/10, squash-merge"], [], ["lane-csv-1: released claim"]]
};
var COORD_STATE = {
  pdf: ["idle","idle","briefing","building","building","gating","merged","noted"],
  tax: ["idle","idle","briefing","building","building","gating","merged","noted"],
  csv: ["idle","idle","briefing","building","building","gating","merged","noted"]
};
var PR_STATE = {
  pdf: ["none","none","none","none","none","score","merged","merged"],
  tax: ["none","none","none","none","none","score","merged","merged"],
  csv: ["none","none","none","none","none","score","merged","merged"]
};
var PR_LABEL = {none:"no PR", score:"9/10", merged:"merged"};
var SLOT_HOLDER = ["", "", "", "", "pdf", "pdf", "csv", "csv"];
var PR_LABEL_OVERRIDE = {"csv-5":"10/10","pdf-5":"9/10"};

var RAIL = [
  [],
  [{from:"Master", to:"You", text:"Splitting into three tracks: PDF, tax rounding, CSV export."}],
  [{from:"coord-pdf", to:"Master", text:"Brief written: scope, files, pattern to copy."}],
  [{from:"coord-tax", to:"Master", text:"Lane paused on a reserved decision."}],
  [{from:"coord-pdf", to:"coord-csv", text:"Both touch money/format.ts. I merge first, you rebase."}, {from:"coord-csv", to:"coord-pdf", text:"Waiting on your merge."}],
  [{from:"coord-csv", to:"Master", text:"Gate item 6 failed (mutation didn't bite). Sent back."}, {from:"coord-csv", to:"Master", text:"Reworked. 10/10."}],
  [{from:"coord-pdf", to:"Master", text:"Merged."}, {from:"coord-tax", to:"Master", text:"Merged."}, {from:"coord-csv", to:"Master", text:"Merged."}],
  [{from:"Master", to:"You", text:"Three PRs merged. One decision recorded. Nothing blocked."}]
];

var YOU_LINE = [
  "You &rsaquo; &ldquo;Ship the invoicing fixes this week.&rdquo;",
  "You &rsaquo; &ldquo;Ship the invoicing fixes this week.&rdquo;",
  "You &rsaquo; sent. Master is splitting the work.",
  "You &rsaquo; sent. Master is splitting the work.",
  "You &rsaquo; sent. Master is splitting the work.",
  "You &rsaquo; sent. Master is splitting the work.",
  "You &rsaquo; sent. Master is splitting the work.",
  "You &rsaquo; Master: three PRs merged, nothing blocked."
];
var MASTER_TXT = [
  "waiting for you",
  "read PRD + last handoff, splitting the work",
  "coordinators writing briefs",
  "lanes building; tax-rounding has hit a reserved decision",
  "PDF and CSV both need money/format.ts",
  "gating three PRs against the ten-item review",
  "three squash-merges, one slot, no collisions",
  "done for the day"
];
var MASTER_STATE = ["waiting","splitting","briefing","building","coordinating","gating","shipping","done"];

var TRANSCRIPTS = {
  master: ["Reads PRD and last handoff.", "Splits: Invoice PDF, Tax rounding, CSV export.", "Opens three tabs, one coordinator each.", "Waits for evidence, not typing."],
  "coord-pdf": ["Brief: scope invoice/pdf, pattern to copy, no reserved decisions.", "Watches lane-pdf-1 build.", "Merges first into money/format.ts.", "Gate 9/10, merged."],
  "coord-tax": ["Brief: scope tax/rounding.", "Reserved decision: rounding mode. Lane paused, asked you.", "Resumed after your call.", "Gate 10/10, merged."],
  "coord-csv": ["Brief: scope csv/export.", "Waits for PDF's merge to money/format.ts, then rebases.", "Gate item 6 failed: mutation didn't bite. Sent back as a file.", "Reworked, gate 10/10, merged."],
  "lane-pdf-1": ["claim c_a1 scope invoice/pdf", "worktree wt-pdf-1 ready", "render.go: PDF layout for line items", "commit: add invoice PDF renderer", "PR opened against main"],
  "lane-pdf-2": ["pdf_test.go: golden file for layout", "commit: add renderer tests"],
  "lane-tax-1": ["claim c_a2 scope tax/rounding", "hit reserved decision: half up or banker's?", "resumed: half up (your call)", "commit: round half up in tax calc", "PR opened, gate 10/10"],
  "lane-tax-2": ["tax_test.go: rounding edge cases"],
  "lane-csv-1": ["claim c_a3 scope csv/export", "exporter.go: CSV writer for line items", "waiting: PDF holds money/format.ts", "rebased onto main after PDF merge", "gate rework: mutation test on money.Round"],
  "lane-csv-2": ["exporter_test.go: quoting and delimiters"]
};

/* ---------- state ---------- */
var decisionChoice = null;
var idx = 0;
var playing = false;
var lastIdx = -1;

var stepsEl = document.getElementById("steps");
var stageEl = document.getElementById("stage");
var tracksEl = document.getElementById("tracks");
var railEl = document.getElementById("rail");
var stationLabelEl = document.getElementById("stationLabel");
var scrubEl = document.getElementById("scrub");
var playBtn = document.getElementById("playPause");
var youbarEl = document.getElementById("youbar");
var masterNode = document.getElementById("masterNode");

STATION_NAMES.forEach(function(name, i){
  var d = document.createElement("div");
  d.className = "step"; d.dataset.i = i;
  d.innerHTML = "<b>"+(i+1)+"</b> "+name;
  stepsEl.appendChild(d);
});

TRACKS.forEach(function(t, ti){
  var col = document.createElement("div");
  col.className = "track"; col.dataset.i = ti;
  col.innerHTML =
    "<h3>"+t.name+"</h3>" +
    '<div class="term" data-node="coord-'+t.key+'"><div class="hd"><span class="name">Coordinator</span><span class="badge">Sonnet</span><span class="state" data-role="cstate">idle</span></div><pre data-role="clog"></pre></div>' +
    '<div class="lanewrap">' + t.lanes.map(function(l){
      return '<div class="term" data-node="'+l+'"><div class="hd"><span class="name">'+l+'</span></div><pre data-role="lane"></pre></div>';
    }).join("") + '</div>' +
    '<div class="prrow" data-role="prrow"><span class="prchip" data-role="pr" data-state="none">no PR</span></div>';
  tracksEl.appendChild(col);
});

var slotBadge = document.createElement("div");
slotBadge.className = "slotbadge"; slotBadge.textContent = "slot";
stageEl.appendChild(slotBadge);

/* click-through transcripts */
document.body.addEventListener("click", function(e){
  var node = e.target.closest("[data-node]");
  if (!node) return;
  var key = node.dataset.node;
  var lines = TRANSCRIPTS[key];
  if (!lines) return;
  openPanel(key, lines);
});
function openPanel(title, lines){
  document.getElementById("panelTitle").textContent = title;
  document.getElementById("panelBody").textContent = lines.join("\n");
  document.getElementById("panel").hidden = false;
}
document.getElementById("panelClose").addEventListener("click", closePanel);
function closePanel(){ document.getElementById("panel").hidden = true; }
document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closePanel();
  if (e.key === " "){ e.preventDefault(); togglePlay(); }
  if (e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
});

/* ---------- typing effect ---------- */
function typeLine(el, text){
  if (reduced || typeof gsap === "undefined"){ el.textContent = text; return; }
  var obj = {n:0};
  gsap.to(obj, {n:text.length, duration:Math.max(text.length/40,.05), ease:"none", onUpdate:function(){
    el.textContent = text.slice(0, Math.round(obj.n));
  }});
}

function lastLines(list, n){ return list.slice(Math.max(0,list.length-n)); }

/* ---------- message travel ---------- */
function travel(msg){
  if (reduced) return;
  var from = document.querySelector('[data-node="'+keyOf(msg.from)+'"]');
  var to = document.querySelector('[data-node="'+keyOf(msg.to)+'"]');
  if (!from || !to || typeof gsap === "undefined") return;
  var sr = stageEl.getBoundingClientRect();
  var fr = from.getBoundingClientRect(), tr = to.getBoundingClientRect();
  var x1 = fr.left+fr.width/2-sr.left+stageEl.scrollLeft, y1 = fr.top+fr.height/2-sr.top+stageEl.scrollTop;
  var x2 = tr.left+tr.width/2-sr.left+stageEl.scrollLeft, y2 = tr.top+tr.height/2-sr.top+stageEl.scrollTop;
  var pill = document.createElement("div");
  pill.className = "pill"; pill.textContent = msg.text.slice(0,28);
  pill.style.left = x1+"px"; pill.style.top = y1+"px";
  stageEl.appendChild(pill);
  gsap.to(pill, {left:x2, top:y2, duration:.5, ease:"power1.inOut", onComplete:function(){ pill.remove(); }});
}
function keyOf(name){
  if (name === "You" || name === "Master") return name.toLowerCase();
  return name;
}
masterNode.dataset.node = "master";

/* ---------- render ---------- */
function moveSlot(track){
  if (!track){ slotBadge.style.transform = "translate(-9999px,-9999px)"; return; }
  var row = document.querySelector('.track[data-i="'+TRACKS.map(function(t){return t.key;}).indexOf(track)+'"] [data-role="prrow"]');
  if (!row) return;
  var sr = stageEl.getBoundingClientRect(), rr = row.getBoundingClientRect();
  var x = rr.right - sr.left + stageEl.scrollLeft - 26, y = rr.top - sr.top + stageEl.scrollTop + 1;
  if (reduced || typeof gsap === "undefined"){ slotBadge.style.transform = "translate("+x+"px,"+y+"px)"; return; }
  gsap.to(slotBadge, {x:x, y:y, duration:.4, ease:"power1.inOut"});
}

function render(opts){
  opts = opts || {};
  var animate = opts.forward && !reduced;

  stepsEl.querySelectorAll(".step").forEach(function(el){
    var i = +el.dataset.i;
    el.dataset.lit = i < idx ? "past" : (i === idx ? "now" : "future");
  });
  stationLabelEl.textContent = (idx+1)+" · "+STATION_NAMES[idx];
  scrubEl.value = idx/7;
  playBtn.textContent = playing ? "Pause" : "Play";

  youbarEl.innerHTML = YOU_LINE[idx];

  var mState = masterNode.querySelector('[data-role="state"]');
  if (mState.textContent !== MASTER_STATE[idx] && animate && typeof gsap !== "undefined"){
    gsap.fromTo(mState, {opacity:0}, {opacity:1, duration:.15});
  }
  mState.textContent = MASTER_STATE[idx];
  masterNode.classList.toggle("typing", idx > 0 && idx < 7);
  var mlog = masterNode.querySelector('[data-role="log"]');
  mlog.textContent = MASTER_TXT.slice(0, idx+1).slice(-3).join("\n");

  TRACKS.forEach(function(t, ti){
    var col = tracksEl.querySelector('.track[data-i="'+ti+'"]');
    var cstate = col.querySelector('[data-role="cstate"]');
    var newC = idx===0 ? "waiting" : COORD_STATE[t.key][idx];
    if (cstate.textContent !== newC && animate && typeof gsap !== "undefined") gsap.fromTo(cstate, {opacity:0}, {opacity:1, duration:.15});
    cstate.textContent = newC;
    var clog = col.querySelector('[data-role="clog"]');
    var briefLines = [];
    if (idx>=2) briefLines.push("brief: scope "+t.key+"/*, pattern to copy");
    if (idx>=3) briefLines.push("watching lanes build");
    if (idx>=5) briefLines.push("gate run against the ten-item review");
    if (idx>=6) briefLines.push("squash-merged, note written");
    clog.textContent = lastLines(briefLines,3).join("\n");

    t.lanes.forEach(function(l, li){
      var acc = [];
      for (var s=0; s<=idx; s++){
        LANE_LINES[t.key][s].forEach(function(line){
          if (line.indexOf(l+":") === 0) acc.push(line.slice(l.length+2));
        });
      }
      var laneEl = col.querySelectorAll('[data-role="lane"]')[li];
      var termEl = laneEl.closest(".term");
      var shown = lastLines(acc,4);
      var isNew = shown.length && shown[shown.length-1] !== laneEl.dataset.last;
      laneEl.dataset.last = shown.length ? shown[shown.length-1] : "";
      if (isNew && animate){
        termEl.classList.add("typing");
        laneEl.textContent = shown.slice(0,-1).join("\n") + (shown.length>1?"\n":"");
        var span = document.createElement("span");
        span.className = "cur";
        laneEl.appendChild(span);
        typeLine(span, shown[shown.length-1]);
        setTimeout(function(){ termEl.classList.remove("typing"); }, shown[shown.length-1].length*25+300);
      } else {
        laneEl.textContent = shown.join("\n");
      }
    });

    var pr = col.querySelector('[data-role="pr"]');
    var prState = PR_STATE[t.key][idx];
    pr.dataset.state = prState;
    var override = PR_LABEL_OVERRIDE[t.key+"-"+idx];
    pr.textContent = override ? override : PR_LABEL[prState];
  });

  moveSlot(SLOT_HOLDER[idx] || null);

  var hint = document.getElementById("railHint");
  railEl.querySelectorAll(".msg").forEach(function(m){ m.remove(); });
  var all = [];
  for (var s=0; s<=idx; s++){ all = all.concat(RAIL[s]); }
  hint.style.display = all.length ? "none" : "block";
  all.forEach(function(m, i){
    var el = document.createElement("div");
    el.className = "msg";
    el.innerHTML = '<span class="from">'+m.from+' &rarr; '+m.to+'</span><div>'+m.text+'</div>';
    railEl.appendChild(el);
  });
  if (animate){ (RAIL[idx]||[]).forEach(travel); }

  maybePause();
  lastIdx = idx;
}

function maybePause(){
  var box = document.getElementById("decisionBox");
  if (box) box.remove();
  stageEl.classList.toggle("dim", idx === 3 && decisionChoice === null);
  if (idx === 3 && decisionChoice === null){
    playing = false; playBtn.textContent = "Play";
    var d = document.createElement("div");
    d.id = "decisionBox"; d.className = "decision";
    d.innerHTML = '<span>Round half up or banker\'s rounding?</span><br>' +
      '<button class="pillbtn" data-choice="up">Half up</button>' +
      '<button class="pillbtn" data-choice="bankers">Banker\'s</button>';
    youbarEl.insertAdjacentElement("afterend", d);
    d.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        decisionChoice = b.dataset.choice;
        RAIL[3] = RAIL[3].concat([{from:"You", to:"coord-tax", text:"Use "+(decisionChoice==="up"?"half up":"banker's")+" rounding."}]);
        render({forward:true});
      });
    });
  }
}

/* ---------- transport ---------- */
function step(dir){
  var next = idx + dir;
  if (next < 0 || next > 7) return;
  if (dir > 0 && idx === 3 && decisionChoice === null) return;
  idx = next;
  render({forward: dir>0});
}
function togglePlay(){
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) tick();
}
function tick(){
  if (!playing) return;
  if (idx === 3 && decisionChoice === null){ playing = false; playBtn.textContent = "Play"; return; }
  if (idx >= 7){ playing = false; playBtn.textContent = "Play"; return; }
  setTimeout(function(){
    if (!playing) return;
    step(1);
    tick();
  }, reduced ? 10 : 1600);
}

playBtn.addEventListener("click", togglePlay);
document.getElementById("stepFwd").addEventListener("click", function(){ step(1); });
document.getElementById("stepBack").addEventListener("click", function(){ step(-1); });
scrubEl.addEventListener("input", function(){
  var target = Math.round(+scrubEl.value * 7);
  if (target > 3 && idx <= 3 && decisionChoice === null) target = 3;
  idx = target;
  render({forward:false});
});
window.addEventListener("resize", function(){ moveSlot(SLOT_HOLDER[idx] || null); });

render({forward:false});

/* ---------- self-test ---------- */
if (location.hash === "#selftest"){
  var fails = [];
  function assert(cond, msg){ if (!cond) fails.push(msg); }
  decisionChoice = "up";
  idx = 7; render({forward:false});
  assert(stepsEl.querySelectorAll('[data-lit="now"]').length === 1, "exactly one lit-now station");
  assert(+stepsEl.querySelector('[data-lit="now"]').dataset.i === 7, "station strip lit index at end");
  TRACKS.forEach(function(t, ti){
    var col = tracksEl.querySelector('.track[data-i="'+ti+'"]');
    assert(col.querySelector('[data-role="pr"]').dataset.state === "merged", "PR merged for "+t.key);
  });
  for (var s = 6; s <= 7; s++){
    idx = s; render({forward:false});
    assert(!!SLOT_HOLDER[s], "exactly one slot token visible at station "+(s+1));
  }
  console.assert(fails.length === 0, "full-power selftest failures:", fails);
  if (fails.length === 0) console.log("full-power selftest: OK"); else console.log(fails);
  idx = 0; decisionChoice = null; render({forward:false});
}
})();
</script>
